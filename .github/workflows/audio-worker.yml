name: Audio Extraction & STT Worker

on:
  repository_dispatch:
    types: [process_audio]
  workflow_dispatch:

jobs:
  extract-and-transcribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies & yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests

      - name: Run Audio Extraction Worker Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/worker.py \
            --url "${{ github.event.client_payload.url }}" \
            --bookmark-id "${{ github.event.client_payload.bookmark_id }}" \
            --callback-url "${{ github.event.client_payload.callback_url }}" \
            --chat-id "${{ github.event.client_payload.chat_id }}" \
            --message-id "${{ github.event.client_payload.message_id }}" \
            --groq-key "${{ secrets.GROQ_API_KEY }}"
