name: Audio Extraction & STT Worker

on:
  repository_dispatch:
    types: [process_audio]
  workflow_dispatch:
    inputs:
      url:
        description: 'Target Social Media URL'
        required: false
      bookmark_id:
        description: 'Bookmark ID'
        required: false
      callback_url:
        description: 'Vercel Callback URL'
        required: false

jobs:
  extract-and-transcribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies & yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests

      - name: Run Audio Extraction Worker Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAYLOAD_URL: ${{ github.event.client_payload.url || inputs.url }}
          PAYLOAD_BOOKMARK_ID: ${{ github.event.client_payload.bookmark_id || inputs.bookmark_id }}
          PAYLOAD_CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url }}
          PAYLOAD_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          PAYLOAD_MESSAGE_ID: ${{ github.event.client_payload.message_id }}
        run: |
          python scripts/worker.py \
            --url "$PAYLOAD_URL" \
            --bookmark-id "$PAYLOAD_BOOKMARK_ID" \
            --callback-url "$PAYLOAD_CALLBACK_URL" \
            --chat-id "$PAYLOAD_CHAT_ID" \
            --message-id "$PAYLOAD_MESSAGE_ID" \
            --groq-key "${{ secrets.GROQ_API_KEY }}"
